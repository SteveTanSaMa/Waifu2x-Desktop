name: Apple Silicon release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the app version as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and package arm64
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version

      - name: Run unit tests
        run: bash script/test.sh --unit

      - name: Test model and incremental update packaging
        run: python3 -m unittest discover -s script -p 'test_*.py'

      - name: Fetch the previous app for an incremental package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/update-base
          # A first release or unavailable base still produces a complete verified update.
          if command -v gh >/dev/null && gh release view --json tagName,assets > build/update-base/release.json; then
            BASE_TAG="$(jq -r '.tagName' build/update-base/release.json)"
            BASE_NAME="$(jq -r '[.assets[].name | select(test("^Waifu2x-[0-9]+\\.[0-9]+\\.[0-9]+-macos-arm64\\.zip$"))][0] // empty' build/update-base/release.json)"
            if [[ "$BASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && -n "$BASE_NAME" ]] &&
               gh release download "$BASE_TAG" --pattern "$BASE_NAME" --dir build/update-base; then
              printf 'APP_UPDATE_BASE_ZIP=%s/build/update-base/%s\n' "$PWD" "$BASE_NAME" >> "$GITHUB_ENV"
            else
              echo 'No compatible previous app package; using a complete update catalog'
            fi
          else
            echo 'Previous release is unavailable; using a complete update catalog'
          fi

      - name: Build and package Apple Silicon app
        id: package
        run: bash script/package_release.sh

      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Waifu2x-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/Waifu2x-update.json
            dist/*.delta.tar.xz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-arm64
          path: |
            build/*.log
            build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      HEAD_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate requested version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "${HEAD_MESSAGE%%$'\n'*}" = "release: $RELEASE_TAG"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi

      - name: Download app packages
        run: |
          gh run download "$GITHUB_RUN_ID" --name Waifu2x-macos-arm64 --dir dist

      - name: Verify prepared draft and model archive
        run: |
          # Prepare this draft and upload its model archive before triggering publication.
          # Published releases and drafts targeting another commit cannot be overwritten.
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json
          jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' release.json

          CATALOG=Waifu2x/Resources/ModelCatalog.json
          jq -e '.schemaVersion == 3' "$CATALOG"
          MODEL_ARCHIVE_NAME="$(jq -er '.archive.path | select(test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.tar\\.xz$"))' "$CATALOG")"
          MODEL_ARCHIVE_BYTES="$(jq -er '.archive.bytes | select(type == "number" and . > 0 and floor == .)' "$CATALOG")"
          MODEL_ARCHIVE_SHA256="$(jq -er '.archive.sha256 | select(test("^[a-f0-9]{64}$"))' "$CATALOG")"
          MODEL_ARCHIVE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$MODEL_ARCHIVE_NAME"
          jq -e --arg url "$MODEL_ARCHIVE_URL" '.archive.sourceURL == $url' "$CATALOG"

          gh release download "$RELEASE_TAG" --pattern "$MODEL_ARCHIVE_NAME" --dir dist
          test "$(wc -c < "dist/$MODEL_ARCHIVE_NAME" | tr -d '[:space:]')" = "$MODEL_ARCHIVE_BYTES"
          printf '%s  %s\n' "$MODEL_ARCHIVE_SHA256" "$MODEL_ARCHIVE_NAME" >> dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS > /dev/null

      - name: Build content-addressed model repair assets
        run: |
          MODEL_ARCHIVE_NAME="$(jq -r '.archive.path' Waifu2x/Resources/ModelCatalog.json)"
          MODEL_VERSION="$(jq -r '.catalogVersion' Waifu2x/Resources/ModelCatalog.json)"
          MODEL_ROOT="$PWD/build/TestModels/$MODEL_VERSION"
          # Extraction checks all raw model hashes before any repair asset is built.
          python3 script/fetch_test_models.py --archive "dist/$MODEL_ARCHIVE_NAME" --root "$MODEL_ROOT"
          python3 script/package_models.py --root "$MODEL_ROOT" --release "$RELEASE_TAG" --repair-only
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('dist')
          catalog = json.loads(Path('Waifu2x/Resources/ModelCatalog.json').read_text())
          name = 'Waifu2x-' + catalog['catalogVersion'] + '-repair.json'
          repair = json.loads((root / name).read_text())
          names = {name} | {item['archive']['path'] for item in repair['files']}
          with (root / 'SHA256SUMS').open('a') as output:
              for name in sorted(names):
                  digest = hashlib.sha256()
                  with (root / name).open('rb') as source:
                      for chunk in iter(lambda: source.read(4 * 1024 * 1024), b''):
                          digest.update(chunk)
                  output.write(digest.hexdigest() + '  ' + name + '\n')
          print(f'Prepared {len(names) - 1} model repair archives and their index')
          PY
          (cd dist && sha256sum --check SHA256SUMS > /dev/null)

      - name: Upload app packages and publish
        run: |
          if [[ -f ".github/release-notes/$RELEASE_TAG.md" ]]; then
            gh release edit "$RELEASE_TAG" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --title "Waifu2x Desktop $RELEASE_VERSION"
          # The verified model archive is already on the draft; never replace it here.
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS --clobber
          gh release upload "$RELEASE_TAG" dist/Waifu2x-update.json dist/Waifu2x-models-*-repair.json dist/Waifu2x-model-*.tar.xz --clobber
          shopt -s nullglob
          DELTAS=(dist/*.delta.tar.xz)
          if [[ ${#DELTAS[@]} -gt 0 ]]; then
            gh release upload "$RELEASE_TAG" "${DELTAS[@]}" --clobber
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
